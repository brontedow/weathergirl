
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weathergirl</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      background-color: white;
      background-image:
        url("background1.jpg"),
        url("backgroundclean.jpg");
      background-size: contain, cover;
      background-position: left top, center center;
      background-repeat: no-repeat, no-repeat;
      background-attachment: scroll;
      color: black;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      font-weight: normal;
    }

    .description {
      position: absolute;
      top: 24px;
      left: 24px;
      max-width: 360px;
      line-height: 1.3;
      z-index: 2;
    }

    .events {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-align: center;
      z-index: 2;
    }

    .events a,
    .contact {
      color: black;
      text-decoration: none;
    }

    .events a:hover,
    .contact:hover {
      text-decoration: underline;
    }

    .contact {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 2;
    }

    .random-image {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: min(38vw, 520px);
      height: min(48vh, 420px);
      object-fit: contain;
      object-position: right bottom;
      z-index: 1;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
        background-size: 100% auto, cover;
        background-position: left top, center center;
      }

      .description {
        top: 18px;
        left: 18px;
        max-width: 45%;
      }

      .events {
        top: 32px;
        left: 50%;
        gap: 10px;
        max-width: 48%;
      }

      .contact {
        left: 18px;
        bottom: 18px;
      }

      .random-image {
        right: 18px;
        bottom: 48px;
        width: 55vw;
        height: 32vh;
      }
    }
  </style>
</head>

<body>

  <div class="description">
    An itinerant screening series dedicated to showcasing funny, sad, and perverse artist’s moving image organised by Bronte Dow and Freya Field-Donovan.
  </div>

  <main class="events">
    <a href="weathergirl-9.html">Weathergirl 9 (upcoming)</a>
    <a href="weathergirl-8.html">Weathergirl 8</a>
    <a href="weathergirl-7.html">Weathergirl 7</a>
    <a href="weathergirl-6.html">Weathergirl 6</a>
    <a href="weathergirl-5.html">Weathergirl 5</a>
    <a href="weathergirl-4.html">Weathergirl 4</a>
    <a href="weathergirl-3.html">Weathergirl 3</a>
    <a href="weathergirl-2.html">Weathergirl 2</a>
    <a href="weathergirl-1.html">Weathergirl 1</a>
  </main>

  <a class="contact" href="mailto:">Contact</a>

  <img
    class="random-image"
    id="randomImage"
    src="1.jpg"
    alt=""
  >

  <script>
    const randomImage = document.getElementById("randomImage");
    let previousImage = 0;

    function changeImage() {
      let nextImage;

      do {
        nextImage = Math.floor(Math.random() * 20) + 1;
      } while (nextImage === previousImage);

      previousImage = nextImage;
      randomImage.src = nextImage + ".jpg";
    }

    changeImage();
    setInterval(changeImage, 5000);
  </script>

</body>
</html>
