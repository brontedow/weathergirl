
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weathergirl</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: white;
      background-image: url("background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: black;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      font-weight: normal;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .events {
      position: absolute;
      top: 50%;
      left: 24px;
      transform: translateY(-50%);
      width: fit-content;
    }

    .events a {
      display: block;
      width: fit-content;
      margin-bottom: 7px;
      color: black;
      text-decoration: none;
    }

    .events a:hover {
      text-decoration: underline;
    }

    .contact {
      position: fixed;
      bottom: 24px;
      left: 24px;
      color: black;
      text-decoration: none;
    }

    .contact:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
        background-attachment: scroll;
      }

      .events {
        left: 18px;
      }

      .contact {
        left: 18px;
        bottom: 18px;
      }
    }
  </style>
</head>

    <a href="weathergirl-1.html">Weathergirl 1</a>
  </main>

  <a class="contact" href="mailto:">Contact</a>

</body>
</html>
