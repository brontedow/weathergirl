
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weathergirl</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      font-size: 18px;
      line-height: 1.25;
      color: #000;
      background: #fff;
    }

    /* Background layers */
    .background {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background: #fff;
    }

    .background img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 55% center;
    }

    #random-background {
      z-index: 0;
    }

    #background-layer {
      z-index: 1;
      pointer-events: none;
    }

    #clean-layer {
      z-index: 2;
      pointer-events: none;
    }

    /* Main page content */
    main {
      position: relative;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    nav a,
    nav span {
      color: #000;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    nav a:hover {
      text-decoration: underline;
    }

    nav span {
      cursor: default;
    }

    .footer {
      margin-top: auto;
      padding-top: 40px;
      max-width: 700px;
    }

    .footer p {
      margin: 0 0 8px;
    }

    .footer a {
      color: #000;
      text-decoration: underline;
    }

    .footer a:hover {
      text-decoration: none;
    }

    @media (max-width: 600px) {
      main {
        padding: 14px;
      }

      body {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="background" aria-hidden="true">
    <img id="random-background" src="1.jpg" alt="">
    <img id="background-layer" src="background1.jpg" alt="">
    <img id="clean-layer" src="backgroundclean.jpg" alt="">
  </div>

  <main>
    <nav aria-label="Weathergirl screening archive">
      <span>Weathergirl 9 (upcoming)</span>

      <a href="weathergirl-8.html">Weathergirl 8</a>
      <a href="weathergirl-7.html">Weathergirl 7</a>
      <a href="weathergirl-6.html">Weathergirl 6</a>
      <a href="weathergirl-5.html">Weathergirl 5</a>
      <a href="weathergirl-4.html">Weathergirl 4</a>
      <a href="weathergirl-3.html">Weathergirl 3</a>
      <a href="weathergirl-2.html">Weathergirl 2</a>
      <a href="weathergirl-1.html">Weathergirl 1</a>
    </nav>

    <footer class="footer">
      <p>
        Weathergirl is an itinerant programme of artist film screenings
        organised by Bronte Dow and Freya Field-Donovan.
      </p>

      <p>
        <a href="mailto:dowbronte@gmail.com?cc=freya.field.donovan@gmail.com">
          Contact
        </a>
      </p>
    </footer>
  </main>

  <script>
    // Select a random image from 1.jpg to 32.jpg.
    const imageNumber = Math.floor(Math.random() * 32) + 1;
    document.getElementById("random-background").src =
      imageNumber + ".jpg";
  </script>

</body>
</html>
