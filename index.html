<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weathergirl</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Helvetica, Arial, sans-serif;
      color: black;
      background-image: url("backgroundclean.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    a {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }

    a:hover {
      color: #914b3b;
    }

    .events {
      position: absolute;
      top: calc(4vh + 3.45em);
      left: 2.5vw;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.65em;
      max-width: 45vw;
      z-index: 20;
      pointer-events: auto;
      line-height: 1.15;
      font-size: clamp(14px, 1.4vw, 22px);
      font-weight: normal;
    }

    .events a {
      position: relative;
      display: inline-block;
      max-width: 100%;
      overflow-wrap: anywhere;
      font-size: 1em;
      pointer-events: auto;
    }

    .events a:hover {
      color: #914b3b;
    }

    .logo {
      position: fixed;
      top: -18px;
      right: -20px;
      display: block;
      width: 1650px;
      max-width: none;
      height: auto;
      z-index: 10;
      pointer-events: none;
    }

    /* Random images */
    .random-image {
      position: fixed;
      top: 60%;
      left: 62%;
      transform: translate(-50%, -50%);
      width: min(67vw, 920px);
      height: min(70vh, 700px);
      object-fit: contain;
      object-position: center center;
      z-index: 2;
      pointer-events: none;
    }

    /* About and contact link */
    .about-link {
      position: fixed;
      top: 4vh;
      right: 4.5vw;
      z-index: 30;
      font-size: clamp(26px, 2.7vw, 38px);
      line-height: 1;
      font-weight: normal;
      text-decoration: none;
      pointer-events: auto;
    }

    .about-link:hover {
      color: #914b3b;
    }

    @media (max-width: 700px) {
      body {
        background-attachment: scroll;
      }

      .events {
        top: calc(3vh + 3.45em);
        left: 4vw;
        max-width: 48vw;
        gap: 0.6em;
        line-height: 1.15;
        font-size: clamp(14px, 3.5vw, 19px);
      }

      .events a {
        font-size: 1em;
      }

      .logo {
        top: -8px;
        right: -8px;
        width: 320px;
        max-width: 55vw;
      }

      .random-image {
        top: 58%;
        left: 60%;
        width: 90vw;
        height: 68vh;
      }

      .about-link {
        top: 3.5vh;
        right: 7vw;
        font-size: 31px;
      }
    }

    @media (max-width: 380px) {
      .events {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <nav class="events" aria-label="Screening archive">
    <span>Weathergirl 9 (upcoming)</span>
    <a href="./weathergirl-8.html">Weathergirl 8</a>
    <a href="./weathergirl-7.html">Weathergirl 7</a>
    <a href="./weathergirl-6.html">Weathergirl 6</a>
    <a href="./weathergirl-5.html">Weathergirl 5</a>
    <a href="./weathergirl-4.html">Weathergirl 4</a>
    <a href="./weathergirl-3.html">Weathergirl 3</a>
    <a href="./weathergirl-2.html">Weathergirl 2</a>
    <a href="./weathergirl-1.html">Weathergirl 1</a>
  </nav>

  <a class="about-link" href="./aboutcontact.html" aria-label="About and contact">+</a>

  <img
    class="logo"
    src="logo.png"
    alt="Weathergirl"
  >

  <img
    id="randomImage"
    class="random-image"
    src="1.jpg"
    alt=""
  >

  <script>
    const randomImage = document.getElementById("randomImage");
    let previousNumber = 0;

    function loadRandomImage() {
      let number;

      do {
        number = Math.floor(Math.random() * 32) + 1;
      } while (number === previousNumber);

      previousNumber = number;
      randomImage.src = number + ".jpg";
    }

    loadRandomImage();
    setInterval(loadRandomImage, 5000);
  </script>

</body>
</html>
