
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weathergirl</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      background-color: white;
      background-image: url("background1.jpg");
      background-size: contain;
      background-position: left top;
      background-repeat: no-repeat;
      background-attachment: scroll;
      color: black;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      font-weight: normal;
    }

    .events {
      position: absolute;
      top: 28%;
      left: 5%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
    }

    .events a,
    .contact {
      color: black;
      text-decoration: none;
    }

    .events a:hover,
    .contact:hover {
      text-decoration: underline;
    }

    .contact {
      position: fixed;
      bottom: 24px;
      left: 24px;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
        background-size: 100% auto;
        background-position: left top;
      }

      .events {
        position: relative;
        top: auto;
        left: auto;
        margin-top: 35vh;
        gap: 10px;
        padding-bottom: 70px;
      }

      .contact {
        left: 18px;
        bottom: 18px;
      }
    }

    @media (max-height: 500px) and (min-width: 601px) {
      .events {
        position: relative;
        top: auto;
        left: auto;
        padding-bottom: 60px;
      }

      .contact {
        position: fixed;
      }
    }
  </style>
</head>

    <a href="weathergirl-8.html">Weathergirl 8</a>
    <a href="weathergirl-7.html">Weathergirl 7</a>
    <a href="weathergirl-6.html">Weathergirl 6</a>
    <a href="weathergirl-5.html">Weathergirl 5</a>
    <a href="weathergirl-4.html">Weathergirl 4</a>
    <a href="weathergirl-3.html">Weathergirl 3</a>
    <a href="weathergirl-2.html">Weathergirl 2</a>
    <a href="weathergirl-1.html">Weathergirl 1</a>
  </main>

  <a class="contact" href="mailto:">Contact</a>

</body>
</html>
