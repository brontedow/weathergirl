<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weathergirl</title>

<style>
:root {
  --background: #fff;
  --text: #000;
  --hover: #b6ff00;
  --edge: 2.5vw;
  --logo-width: clamp(240px, 32vw, 460px);
  --font-size: 16px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--background);
}

body {
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  font-size: var(--font-size);
  line-height: 1.5;
}

a {
  color: inherit;
  text-decoration: none !important;
}

a:hover, a:focus-visible {
  color: var(--hover);
  text-decoration: none !important;
}

/* Fixed logo: identical position on every page */
.site-header {
  position: fixed;
  top: 2vh;
  right: var(--edge);
  z-index: 20;
  padding: 0;
}

#logo-link {
  display: block;
}

.logo {
  display: block;
  width: var(--logo-width);
  max-width: 100%;
  height: auto;
  object-fit: contain;
}

/* Homepage */
.home-view {
  padding: calc(var(--logo-width) * .2 + 4vh) var(--edge) 8vh;
}

.home-layout {
  display: grid;
  grid-template-columns: minmax(180px, .7fr) minmax(0, 2.3fr);
  column-gap: 5vw;
  min-height: 72vh;
}

.home-event-list {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
}

.home-event {
  display: block;
  padding: 2px 0;
  font-size: var(--font-size);
  line-height: 1.5;
}

.home-image-area {
  position: relative;
  min-width: 0;
  min-height: 72vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.home-random-image {
  display: block;
  width: min(52vw, 700px);
  height: min(58vh, 550px);
  object-fit: contain;
  object-position: center;
  filter: none;
  opacity: 1;
}

/* Event pages */
.event-view {
  display: grid;
  grid-template-columns: minmax(130px, .65fr) minmax(0, 2.35fr);
  column-gap: 4vw;
  row-gap: 3vh;
  align-items: start;
  padding: calc(var(--logo-width) * .2 + 3vh) var(--edge) 8vh;
}

.archive {
  grid-column: 1;
  grid-row: 1;
  min-width: 0;
}

.archive-list {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 7px;
  font-size: var(--font-size);
  line-height: 1.5;
}

.archive-link {
  display: inline-block;
}

.archive-link[aria-current="page"] {
  color: var(--text);
}

.event-main {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  flex-direction: column;
  gap: 4vh;
  min-width: 0;
}

/* Collage gallery */
.event-poster {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-auto-flow: dense;
  align-items: start;
  gap: 18px;
  min-width: 0;
  width: 100%;
}

.event-poster img {
  display: block;
  width: 100%;
  height: auto;
  max-width: none;
  max-height: none;
  object-fit: contain;
  filter: none;
  opacity: 1;
}

/* Vary image sizes and positions to create a loose collage */
.event-poster img:nth-child(6n + 1) {
  grid-column: span 7;
}

.event-poster img:nth-child(6n + 2) {
  grid-column: span 5;
  margin-top: 5vh;
}

.event-poster img:nth-child(6n + 3) {
  grid-column: span 4;
  margin-top: -1vh;
}

.event-poster img:nth-child(6n + 4) {
  grid-column: span 6;
  margin-top: 3vh;
}

.event-poster img:nth-child(6n + 5) {
  grid-column: span 5;
  margin-top: 2vh;
}

.event-poster img:nth-child(6n) {
  grid-column: span 7;
  margin-top: 4vh;
}

/* Smaller main posters for Weathergirl 5 and 7 */
.event-poster[data-event="5"] img:first-child,
.event-poster[data-event="7"] img:first-child {
  grid-column: span 5;
}

/* Programme text stays in the right-hand content column */
.programme {
  width: 100%;
  max-width: 760px;
  min-width: 0;
  font-size: var(--font-size);
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.programme-content p {
  margin: 0 0 1.2em;
}

.programme-content .separator {
  margin: 1.5em 0;
}

.programme-content strong {
  font-weight: 700;
}

.programme-content em {
  font-style: italic;
}

.programme-content a {
  text-decoration: none !important;
}

/* About page */
.about-panel {
  display: none;
  padding: calc(var(--logo-width) * .2 + 4vh) var(--edge) 8vh;
}

.about-panel.is-open {
  display: block;
}

.about-content {
  max-width: 680px;
  font-size: var(--font-size);
  line-height: 1.5;
}

.about-content p {
  margin: 0 0 1.2em;
}

.about-content a {
  text-decoration: none !important;
}

.hidden {
  display: none !important;
}

/* Tablet */
@media (max-width: 900px) {
  :root {
    --logo-width: clamp(220px, 34vw, 340px);
  }

  .home-layout {
    grid-template-columns: minmax(150
