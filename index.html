<meta charset="UTF-8">

<title>Weathergirl</title>

:root {
  --background: #fff;
  --text: #000;
  --hover: #b6ff00;
  --edge: 2.5vw;
  --logo-width: clamp(240px, 32vw, 460px);
  --font-size: 16px;
  --line-height: 1.5;
  --paragraph-spacing: 1.2em;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--background);
}

body {
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  font-size: var(--font-size);
  line-height: var(--line-height);
}

a {
  color: inherit;
  text-decoration: none !important;
}

a:hover,
a:focus-visible {
  color: var(--hover);
  text-decoration: none !important;
}

/* Consistent typography across every page */
p,
nav,
.home-event,
.archive-link,
.programme,
.programme-content,
.about-content {
  font-size: var(--font-size);
  line-height: var(--line-height);
}

/* Fixed blue logo */
.site-header {
  position: fixed;
  top: 2vh;
  right: var(--edge);
  z-index: 20;
  padding: 0;
}

#logo-link {
  display: block;
}

.logo {
  display: block;

}

/* Homepage */
.home-view {
  padding: calc(var(--logo-width) * .2 + 4vh) var(--edge) 8vh;
}

.home-layout {
  display: grid;
  grid-template-columns: minmax(180px, .7fr) minmax(0, 2.3fr);
  column-gap: 5vw;

}

.home-event-list {

}

.home-random-image {

}

.event-view {

.archive-link {

.archive-link[aria-current="page"],

}

.event-main {

}

/*
  Irregular collage, without cropping.

  The gallery uses intrinsic image heights.
  Each image's full original dimensions are preserved.
  No fixed row heights or object-fit: cover.
*/
.event-poster {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-auto-rows: auto;

  gap: 12px;

  width: 100%;
  margin: 0;
}

.event-poster img {

  height: auto;
  max-width: 100%;
  min-width: 0;
  min-height: 0;

  object-position: center top;
  align-self: start;
  filter: none !important;
  opacity: 1 !important;
  mix-blend-mode: normal !important;
}

/* Varied image widths for an irregular collage */
.event-poster img:nth-child(6n + 1) {
  grid-column: span 3;
}

.event-poster img:nth-child(6n + 2) {
  grid-column: span 3;

.event-poster img:nth-child(6n + 3) {
  grid-column: span 2;
}

.event-poster img:nth-child(6n + 4) {
  grid-column: span 2;
}

.event-poster img:nth-child(6n + 5) {
  grid-column: span 2;
}

.event-poster img:nth-child(6n) {
  grid-column: span 3;
}

/* Designated posters span the gallery width.

.event-poster img.is-poster {
  grid-column: 1 / -1;
  grid-row: auto;

  height: auto;

  max-height: none;

}
