
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weathergirl</title>

  <style>
    :root {
      --background: #bcc9da;
      --text: #422729;
      --edge: 2.5vw;
      --gap: 3vw;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.65;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .site-header {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 4vh var(--edge) 0;
      position: relative;
      z-index: 5;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2vh;
    }

    .about-toggle {
      position: relative;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }

    .about-toggle::before,
    .about-toggle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: var(--text);
      transform: translate(-50%, -50%);
    }

    .about-toggle::before {
      width: 28px;
      height: 1px;
    }

    .about-toggle::after {
      width: 1px;
      height: 28px;
    }

    .about-toggle[aria-expanded="true"]::after {
      display: none;
    }

    .logo {
      display: block;
      width: clamp(150px, 16vw, 235px);
      max-width: 32vw;
      height: auto;
    }

    .layout {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(150px, 0.7fr) minmax(0, 1.5fr) minmax(230px, 0.9fr);
      column-gap: var(--gap);
      align-items: start;
      padding: 4vh var(--edge) 8vh;
    }

    .archive-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      font-size: 16px;
      line-height: 1.35;
    }

    .archive-link {
      display: inline-block;
    }

    .archive-link[aria-current="page"] {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .gallery {
      min-width: 0;
    }

    .gallery-images {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
      min-width: 0;
    }

    .gallery-images img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /*
      Each event can have its own composition.
      Use these classes in the event data below:
      stacked, side-by-side, or text-led.
    */

    .layout.side-by-side {
      grid-template-columns: minmax(150px, 0.7fr) minmax(0, 1.2fr) minmax(0, 1.2fr);
    }

    .layout.side-by-side .gallery-images {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 16px;
    }

    .layout.side-by-side .gallery-images img {
      width: 100%;
    }

    .layout.text-led {
      grid-template-columns: minmax(150px, 0.7fr) minmax(0, 1fr) minmax(0, 1.5fr);
    }

    .layout.text-led .gallery-images img {
      max-width: 550px;
    }

    .programme {
      min-width: 0;
      font-size: 16px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .programme-content {
      white-space: pre-line;
    }

    .programme-content p {
      margin: 0 0 1.2em;
    }

    .programme-content .separator {
      margin: 1.5em 0;
    }

    .about-panel {
      display: none;
      padding: 4vh var(--edge) 8vh;
      width: 100%;
    }

    .about-panel.is-open {
      display: block;
    }

    .about-content {
      max-width: 750px;
      font-size: 16px;
      line-height: 1.5;
    }

    .about-content p {
      margin: 0 0 1.2em;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 760px) {
      :root {
        --edge: 5vw;
        --gap: 5vw;
      }

      .site-header {
        padding-top: 3vh;
      }

      .logo {
        width: 135px;
        max-width: 38vw;
      }

      .layout,
      .layout.side-by-side,
      .layout.text-led {
        grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.4fr);
        gap: 28px var(--gap);
        padding-top: 4vh;
      }

      .archive {
        grid-column: 1;
        grid-row: 1;
      }

      .gallery {
        grid-column: 2;
        grid-row: 1;
      }

      .programme {
        grid-column: 1 / -1;
        grid-row: 2;
        max-width: 750px;
      }

      .layout.side-by-side .gallery-images {
        grid-template-columns: 1fr;
      }

      .archive-list {
        font-size: 14px;
        gap: 8px;
      }

      .programme {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-right">
      <button
        class="about-toggle"
        id="about-toggle"
        type="button"
        aria-label="Open About and Contact"
        aria-expanded="false"
      ></button>

      <a href="#" id="logo-link" aria-label="Home">
        <img class="logo" src="LOGOpng.png" alt="Weathergirl">
      </a>
    </div>
  </header>

  <main>
    <section class="layout" id="archive-view">
      <nav class="archive" aria-label="Screening archive">
        <div class="archive-list">
          <a class="archive-link" href="#" data-event="9">Weathergirl 9 (upcoming)</a>
          <a class="archive-link" href="#" data-event="8">Weathergirl 8</a>
          <a class="archive-link" href="#" data-event="7">Weathergirl 7</a>
          <a class="archive-link" href="#" data-event="6">Weathergirl 6</a>
          <a class="archive-link" href="#" data-event="5">Weathergirl 5</a>
          <a class="archive-link" href="#" data-event="4">Weathergirl 4</a>
          <a class="archive-link" href="#" data-event="3">Weathergirl 3</a>
          <a class="archive-link" href="#" data-event="2">Weathergirl 2</a>
          <a class="archive-link" href="#" data-event="1">Weathergirl 1</a>
        </div>
      </nav>

      <section class="gallery" aria-label="Programme images">
        <div class="gallery-images" id="gallery-images"></div>
      </section>

      <section class="programme" aria-label="Programme text">
        <div class="programme-content" id="programme-content"></div>
      </section>
    </section>

    <section class="about-panel" id="about-panel">
      <div class="about-content">
        <p>Weathergirl is an artist-run moving image screening programme.</p>
        <p>Contact details to be added.</p>
      </div>
    </section>
  </main>

  <script>
    /*
      Each event is configured independently.
      Images can be added in any order and can be PNG, JPG or WebP.
      Change "layout" per event to choose its composition.
    */

    const programmes = {
      1: {
        layout: "stacked",
        images: ["11.jpg"],
        text: `A programme of works by Shirley Clarke, Therese Henningsen & Aki Ilomäki, Steve Reinke and Deniz Ünal. With contributions by Tim Donovan and Gina Dow

Friday, 15 March 2024, Pelican House, London

––

Shirley Clarke was an American filmmaker.

Tim Donovan is an artist and tiler based in Austin, Texas.

Gina Dow is a Canberran based in southern New South Wales, Australia.

Therese Henningsen is a filmmaker based in London.

Aki Ilomäki is an artist based in Palermo, Italy.

Steve Reinke is a Canadian artist and writer.

Deniz Ünal is an artist and teacher, born in Istanbul and living in London.`
      },

      2: { layout: "stacked", images: [], text: "" },
      3: { layout: "stacked", images: [], text: "" },
      4: { layout: "stacked", images: [], text: "" },
      5: { layout: "stacked", images: [], text: "" },
      6: { layout: "stacked", images: [], text: "" },
      7: { layout: "stacked", images: [], text: "" },
      8: { layout: "stacked", images: [], text: "" },
      9: { layout: "stacked", images: [], text: "" }
    };

    const homeImages = [
      "1.png", "2.png", "3.png", "5.png", "6.png", "7.png",
      "8.png", "9.png", "10.png", "13.png", "14.png", "15.png",
      "16.png", "17.png", "18.png", "19.png", "22.png", "25.png",
      "26.png", "27.png", "28.png", "31.png", "32.jpg"
    ];

    const archiveView = document.getElementById("archive-view");
    const galleryImages = document.getElementById("gallery-images");
    const programmeContent = document.getElementById("programme-content");
    const aboutPanel = document.getElementById("about-panel");
    const aboutToggle = document.getElementById("about-toggle");
    const archiveLinks = [...document.querySelectorAll("[data-event]")];

    let currentEvent = null;
    let randomTimer = null;
    let previousRandomImage = "";
    let shuffledImages = [];

    function shuffleImages() {
      shuffledImages = [...homeImages];

      for (let i = shuffledImages.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledImages[i], shuffledImages[j]] =
          [shuffledImages[j], shuffledImages[i]];
      }

      if (
        shuffledImages.length > 1 &&
        shuffledImages[0] === previousRandomImage
      ) {
        [shuffledImages[0], shuffledImages[1]] =
          [shuffledImages[1], shuffledImages[0]];
      }
    }

    function showHomeImage() {
      if (!shuffledImages.length) shuffleImages();

      const filename = shuffledImages.pop();
      previousRandomImage = filename;
      galleryImages.replaceChildren();

      const image = document.createElement("img");
      image.src = filename;
      image.alt = "";
      image.loading = "eager";
      galleryImages.appendChild(image);

      if (!shuffledImages.length) shuffleImages();
    }

    function startRandomImages() {
      stopRandomImages();
      showHomeImage();
      randomTimer = setInterval(showHomeImage, 5000);
    }

    function stopRandomImages() {
      if (randomTimer) {
        clearInterval(randomTimer);
        randomTimer = null;
      }
    }

    function renderProgramme(id) {
      const programme = programmes[id];
      if (!programme) return;

      stopRandomImages();
      currentEvent = String(id);

      archiveView.classList.remove("side-by-side", "text-led");
      if (programme.layout !== "stacked") {
        archiveView.classList.add(programme.layout);
      }

      archiveLinks.forEach(link => {
        if (link.dataset.event === String(id)) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });

      galleryImages.replaceChildren();

      programme.images.forEach(filename => {
        const image = document.createElement("img");
        image.src = filename;
        image.alt = "";
        image.loading = "lazy";
        galleryImages.appendChild(image);
      });

      programmeContent.textContent = programme.text;
      archiveView.classList.remove("hidden");
      aboutPanel.classList.remove("is-open");
      aboutToggle.setAttribute("aria-expanded", "false");
      aboutToggle.setAttribute("aria-label", "Open About and Contact");
    }

    function showArchiveHome() {
      currentEvent = null;

      archiveLinks.forEach(link => {
        link.removeAttribute("aria-current");
      });

      archiveView.classList.remove("side-by-side", "text-led");
      programmeContent.textContent = "";
      aboutPanel.classList.remove("is-open");
      archiveView.classList.remove("hidden");

      aboutToggle.setAttribute("aria-expanded", "false");
      aboutToggle.setAttribute("aria-label", "Open About and Contact");

      startRandomImages();
    }

    archiveLinks.forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();
        const id = link.dataset.event;

        if (currentEvent === id) {
          showArchiveHome();
        } else {
          renderProgramme(id);
        }
      });
    });

    aboutToggle.addEventListener("click", () => {
      const isOpen = aboutPanel.classList.contains("is-open");

      if (isOpen) {
        aboutPanel.classList.remove("is-open");
        aboutToggle.setAttribute("aria-expanded", "false");
        aboutToggle.setAttribute("aria-label", "Open About and Contact");

        if (currentEvent === null) startRandomImages();
        else archiveView.classList.remove("hidden");
      } else {
        stopRandomImages();
        archiveView.classList.add("hidden");
        aboutPanel.classList.add("is-open");
        aboutToggle.setAttribute("aria-expanded", "true");
        aboutToggle.setAttribute("aria-label", "Close About and Contact");
      }
    });

    document.getElementById("logo-link").addEventListener("click", event => {
      event.preventDefault();
      showArchiveHome();
    });

    startRandomImages();
  </script>
</body>
</html>
